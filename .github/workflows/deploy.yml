# The name on github
name: Deploy

# it runs every time code is pushed to the main branch
on:
  push:
    branches: [main]
  workflow_dispatch:

# this is for GitHub prove to its identity which is OIDC 
permissions:
  id-token: write
  contents: read


env:
  AWS_REGION: us-east-1
  REPO: quotemail-dev-quotes   
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    # The steps to run
    steps:
      # this Downloads the repo's code onto the machine
      - uses: actions/checkout@v4

      # this Logs in to AWS using the role that was created 
      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Set the image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: infra/dev
        run: terraform init

      # this Create only the ECR repository first,
      #    because the image can't be pushed until the repo exists
      - name: Create the ECR repository
        working-directory: infra/dev
        run: terraform apply -auto-approve -target=module.ECR -var "image_tag=$IMAGE_TAG"

      # this Logs in to ECR so Docker is allowed to push
      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # this Build the Docker image from your app folder and push it to ECR
      - name: Build and push the image
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ env.REPO }}:${{ env.IMAGE_TAG }}
          docker build --platform linux/amd64 -t $IMAGE ./daily-quotes-app
          docker push $IMAGE

      # this Run the full Terraform apply, which creates the task definition
      #    pointing at the new image tag
      - name: Deploy with Terraform
        working-directory: infra/dev
        run: terraform apply -auto-approve -var "image_tag=$IMAGE_TAG"